# Full nginx main config for the deploy image (Dockerfile.prod).
#
# One origin serves everything: the built SPA from disk, and — proxied to the
# Go server — /api/v1, the dictionary CDN path, /ws and the health endpoints.
# That is deliberate: the session cookie stays first-party, the backend's CORS
# layer is never exercised, and VITE_API_URL can point at this same host.
#
# It runs as the unprivileged `nginx` user, hence port 8080 and the /tmp paths.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
	worker_connections 4096;
}

http {
	include       /etc/nginx/mime.types;
	default_type  application/octet-stream;

	# Non-root: every scratch path nginx writes to must be somewhere uid 101
	# can write. /var/run and /var/cache/nginx are root-owned.
	client_body_temp_path /tmp/nginx-client-body;
	proxy_temp_path       /tmp/nginx-proxy;
	fastcgi_temp_path     /tmp/nginx-fastcgi;
	uwsgi_temp_path       /tmp/nginx-uwsgi;
	scgi_temp_path        /tmp/nginx-scgi;

	log_format main '$remote_addr $status $request_time "$request" '
	                '$body_bytes_sent "$http_referer" "$http_user_agent"';
	access_log /dev/stdout main;

	sendfile      on;
	tcp_nopush    on;
	tcp_nodelay   on;
	server_tokens off;
	# The SPA is served from the container root; absolute redirects would leak
	# the internal 8080 through the TLS terminator in front.
	absolute_redirect off;
	port_in_redirect  off;

	keepalive_timeout     65s;
	client_body_timeout   30s;
	client_header_timeout 15s;

	# A run submission carries its whole event log — up to 6.5 MiB under the
	# current ingestion caps (docs/RUNS.md). nginx's 1m default would answer a
	# full 10 000-word run with 413 before the server ever saw it.
	client_max_body_size 16m;

	gzip              on;
	gzip_vary         on;
	gzip_comp_level   6;
	gzip_min_length   512;
	gzip_proxied      any;
	gzip_types
		text/plain
		text/css
		text/javascript
		application/javascript
		application/json
		application/manifest+json
		application/wasm
		image/svg+xml
		font/ttf
		font/woff
		font/woff2;

	map $http_upgrade $connection_upgrade {
		default upgrade;
		''      close;
	}

	# Behind a TLS terminator this is already set; standalone it is empty and
	# the server would be told "no scheme". Fall back to our own.
	map $http_x_forwarded_proto $forwarded_proto {
		default $http_x_forwarded_proto;
		''      $scheme;
	}

	# Docker's embedded DNS. Without a resolver nginx resolves `app` once at
	# startup and keeps that address for the process lifetime, so redeploying
	# the API container would 502 until nginx itself restarted.
	resolver 127.0.0.11 ipv6=off valid=10s;

	server {
		listen      8080;
		listen      [::]:8080;
		server_name _;

		root  /usr/share/nginx/html;
		index index.html;

		# NOTE ON add_header: nginx REPLACES inherited headers as soon as a
		# location declares one of its own — it does not merge. So every
		# location below that sets Cache-Control repeats this block. Locations
		# that set no header of their own (the proxies) inherit it.
		add_header X-Content-Type-Options     "nosniff"                         always;
		add_header X-Frame-Options            "DENY"                            always;
		add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
		add_header Cross-Origin-Opener-Policy "same-origin"                     always;
		# No Content-Security-Policy by default: the right value depends on what
		# this deployment actually enables. A starting point for the
		# Turnstile + OAuth setup, to be verified in a browser before shipping:
		#   add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss:; font-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

		# --- API ------------------------------------------------------------
		# proxy_pass through a variable is what forces per-request DNS
		# resolution (see `resolver` above); $request_uri keeps the path and
		# query exactly as the browser sent them.
		location /api/ {
			set $api_upstream app:8080;
			proxy_pass         http://$api_upstream$request_uri;
			proxy_http_version 1.1;
			proxy_set_header   Host              $host;
			proxy_set_header   X-Real-IP         $remote_addr;
			proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
			proxy_set_header   X-Forwarded-Proto $forwarded_proto;
			proxy_set_header   X-Forwarded-Host  $host;
			# The server checks Origin on mutating requests and must see the
			# browser's value, not a rewritten one.
			proxy_set_header   Origin            $http_origin;
			proxy_set_header   Connection        "";
			# Submitting a run is one large POST; buffering it to a temp file
			# first keeps a slow uploader off a server goroutine.
			proxy_request_buffering on;
			proxy_connect_timeout 5s;
			proxy_send_timeout    60s;
			proxy_read_timeout    60s;
		}

		# --- realtime -------------------------------------------------------
		# Matches outlive any sane read timeout, so this location gets its own.
		location = /ws {
			set $ws_upstream app:8080;
			proxy_pass         http://$ws_upstream$request_uri;
			proxy_http_version 1.1;
			proxy_set_header   Upgrade           $http_upgrade;
			proxy_set_header   Connection        $connection_upgrade;
			proxy_set_header   Host              $host;
			proxy_set_header   X-Real-IP         $remote_addr;
			proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
			proxy_set_header   X-Forwarded-Proto $forwarded_proto;
			# The handler enforces its own Origin allow-list
			# (TYPEMORE_ALLOWED_ORIGINS) — pass the real value through.
			proxy_set_header   Origin            $http_origin;
			proxy_buffering    off;
			proxy_connect_timeout 5s;
			proxy_send_timeout   3600s;
			proxy_read_timeout   3600s;
		}

		# --- dictionary bodies ----------------------------------------------
		# Content-addressed and immutable by contract: a changed word list is a
		# new dict_hash, so these can be cached hard at the edge.
		location /static/dictionaries/ {
			set $dict_upstream app:8080;
			proxy_pass         http://$dict_upstream$request_uri;
			proxy_http_version 1.1;
			proxy_set_header   Host            $host;
			proxy_set_header   X-Real-IP       $remote_addr;
			proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header   Connection      "";
			proxy_connect_timeout 5s;
			proxy_read_timeout    30s;
		}

		# --- server health --------------------------------------------------
		# Exposed for an external uptime check; NOT used by this container's own
		# HEALTHCHECK, which must not fail on a backend outage.
		location ~ ^/(?:healthz|readyz)$ {
			set $health_upstream app:8080;
			proxy_pass         http://$health_upstream$request_uri;
			proxy_http_version 1.1;
			proxy_set_header   Host       $host;
			proxy_set_header   Connection "";
			proxy_connect_timeout 3s;
			proxy_read_timeout    5s;
			access_log off;
		}

		# nginx's own liveness, answered from memory.
		location = /nginx-health {
			access_log off;
			default_type text/plain;
			return 200 "ok\n";
		}

		# --- static assets --------------------------------------------------
		# Regex locations are tried in source order, so this one has to precede
		# the asset patterns to actually deny anything. /.well-known stays
		# reachable for an ACME http-01 challenge served from the web root.
		location ~ ^/\.(?!well-known/) {
			deny all;
		}

		# Vite emits content-hashed filenames under /assets, so the URL changes
		# whenever the bytes do and a year of immutable caching is safe.
		location /assets/ {
			try_files $uri =404;
			add_header Cache-Control              "public, max-age=31536000, immutable" always;
			add_header X-Content-Type-Options     "nosniff"                         always;
			add_header X-Frame-Options            "DENY"                            always;
			add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
			add_header Cross-Origin-Opener-Policy "same-origin"                     always;
		}

		# Unhashed public/ assets (fonts, sounds, icons): a month, revalidated.
		location ~* \.(?:woff2?|ttf|otf|eot|png|jpe?g|gif|webp|avif|svg|ico|mp3|ogg|wav|webmanifest)$ {
			try_files $uri =404;
			add_header Cache-Control              "public, max-age=2592000"         always;
			add_header X-Content-Type-Options     "nosniff"                         always;
			add_header X-Frame-Options            "DENY"                            always;
			add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
			add_header Cross-Origin-Opener-Policy "same-origin"                     always;
		}

		# --- the SPA shell --------------------------------------------------
		# index.html must never be cached: it is the document that names the
		# current hashed bundles, and a stale copy pins clients to a deploy that
		# no longer exists.
		location / {
			try_files $uri $uri/ /index.html;
			add_header Cache-Control              "no-cache"                        always;
			add_header X-Content-Type-Options     "nosniff"                         always;
			add_header X-Frame-Options            "DENY"                            always;
			add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
			add_header Cross-Origin-Opener-Policy "same-origin"                     always;
		}
	}
}
