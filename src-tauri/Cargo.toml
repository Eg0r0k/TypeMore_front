[package]
name = "typemore"
version = "0.1.0"
description = "TypeMore - touch typing practice"
authors = ["Eg0r0k"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name; on
# Windows the two collide otherwise (rust-lang/cargo#8519).
name = "typemore_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
